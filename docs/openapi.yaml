                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                steps:
                  minItems: 1
                  maxItems: 1000
                  type: array
                  items:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties:
                      type: object
                      description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                      additionalProperties: true
                chapterId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
