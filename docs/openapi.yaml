openapi: 3.1.0
info:
  title: RiceText 论坛与小说富文本 API
  version: 0.1.0
  description: 文档、章节、用户互动、附件权益和投票均使用共享契约，并由 SQLite 服务持久化实现。
servers:
  - url: http://localhost:8787
    description: 本地开发 API
tags:
  - name: 文档
    description: 文档当前态、不可变修订和乐观并发。
  - name: 图片
    description: 本地白名单图片上传和读取。
  - name: 骰子
    description: 初始化后稳定、可显式重投的跑团骰子。
  - name: 间贴
    description: 段落首尾锚点上的树状回复和赞踩。
  - name: 论坛业务
    description: 论坛创作、用户互动、附件权益和投票能力。
paths:
  /api/documents/{documentId}:
    get:
      operationId: getDocument
      tags:
        - 文档
      summary: 读取当前文档
      description: |-
        读取最新不可变修订的 Tiptap JSON。任何论坛身份均可访问。

        权限与失败状态均列于 responses；请求示例可使用 x-user-id: reader。
      parameters:
        - name: documentId
          in: path
          required: true
          description: 文档稳定 ID，例如 demo-post
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
            description: 文档稳定 ID，例如 demo-post
          example: demo-post
        - name: x-user-id
          in: header
          required: false
          description: 论坛身份 ID：author、reader 或 moderator；省略时默认 reader。生产接入时替换 AuthProvider。
          schema:
            type: string
            enum:
              - author
              - reader
              - moderator
            default: reader
          example: reader
      responses:
        "200":
          description: 当前文档，例如 revision 为 1 的 demo-post。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                  title:
                    type: string
                    minLength: 1
                    maxLength: 200
                  schemaVersion:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  revision:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  savedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  content:
                    type: object
                    properties:
                      type:
                        type: string
                        const: doc
                      content:
                        default: []
                        maxItems: 20000
                        type: array
                        items:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - type
                      - content
                    additionalProperties: false
                required:
                  - id
                  - title
                  - schemaVersion
                  - revision
                  - savedAt
                  - content
                additionalProperties: false
        "404":
          description: 文档不存在。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
                      details:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: EXAMPLE_ERROR
                  message: 文档不存在。
    put:
      operationId: updateDocument
      tags:
        - 文档
      summary: 保存文档并创建修订
      description: |-
        需要 author 或 moderator。baseRevision 过期返回 409；相同 clientMutationId 重试返回首次结果且不重复建版。

        权限与失败状态均列于 responses；请求示例可使用 x-user-id: reader。
      parameters:
        - name: documentId
          in: path
          required: true
          description: 文档稳定 ID，例如 demo-post
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
            description: 文档稳定 ID，例如 demo-post
          example: demo-post
        - name: x-user-id
          in: header
          required: false
          description: 论坛身份 ID：author、reader 或 moderator；省略时默认 reader。生产接入时替换 AuthProvider。
          schema:
            type: string
            enum:
              - author
              - reader
              - moderator
            default: reader
          example: reader
      requestBody:
        required: true
        description: 请求字段由共享 Zod 契约校验。
        content:
          application/json:
            schema:
              type: object
              properties:
                schemaVersion:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                baseRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                clientMutationId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                content:
                  type: object
                  properties:
                    type:
                      type: string
                      const: doc
                    content:
                      default: []
                      maxItems: 20000
                      type: array
                      items:
                        type: object
                        description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                        additionalProperties: true
                  required:
                    - type
                    - content
                  additionalProperties: false
                chapterId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
              required:
                - schemaVersion
                - baseRevision
                - clientMutationId
                - content
              additionalProperties: false
      responses:
        "200":
          description: 幂等重试命中的既有修订。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                  title:
                    type: string
                    minLength: 1
                    maxLength: 200
                  schemaVersion:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  revision:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  savedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  content:
                    type: object
                    properties:
                      type:
                        type: string
                        const: doc
                      content:
                        default: []
                        maxItems: 20000
                        type: array
                        items:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - type
                      - content
                    additionalProperties: false
                required:
                  - id
                  - title
                  - schemaVersion
                  - revision
                  - savedAt
                  - content
                additionalProperties: false
        "201":
          description: 新建的不可变修订。
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                  title:
                    type: string
                    minLength: 1
                    maxLength: 200
                  schemaVersion:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  revision:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  savedAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  content:
                    type: object
                    properties:
                      type:
                        type: string
                        const: doc
                      content:
                        default: []
                        maxItems: 20000
                        type: array
                        items:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - type
                      - content
                    additionalProperties: false
                required:
                  - id
                  - title
                  - schemaVersion
                  - revision
                  - savedAt
                  - content
                additionalProperties: false
        "403":
          description: 当前身份无编辑权限。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
                      details:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: EXAMPLE_ERROR
                  message: 当前身份无编辑权限。
        "409":
          description: 当前 revision 与 baseRevision 冲突，details.currentRevision 可用于刷新。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
                      details:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: EXAMPLE_ERROR
                  message: 当前 revision 与 baseRevision 冲突，details.currentRevision 可用于刷新。
        "422":
          description: 正文包含非法节点、属性或 URL。
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        minLength: 1
                      message:
                        type: string
                        minLength: 1
                      details:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties:
                          type: object
                          description: 递归节点，完整结构由 @ricetext/contracts 的 Zod 契约校验。
                          additionalProperties: true
                    required:
                      - code
                      - message
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
              example:
                error:
                  code: EXAMPLE_ERROR
                  message: 正文包含非法节点、属性或 URL。
  /api/documents/{documentId}/steps:
    patch:
      operationId: updateDocumentSteps
      tags:
        - 文档
      summary: 使用 ProseMirror 增量步骤更新文档
      description: |-
        需要 author 或 moderator。客户端提交 transaction steps，服务端基于当前 revision 应用 steps 并创建新修订。首版仅定义契约，后续实现服务端应用。

        权限与失败状态均列于 responses；请求示例可使用 x-user-id: reader。
      parameters:
        - name: documentId
          in: path
          required: true
          description: 文档稳定 ID，例如 demo-post
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
            description: 文档稳定 ID，例如 demo-post
          example: demo-post
        - name: x-user-id
          in: header
          required: false
          description: 论坛身份 ID：author、reader 或 moderator；省略时默认 reader。生产接入时替换 AuthProvider。
          schema:
