  /api/forum/novels/{novelId}/chapters/sync:
    post:
      operationId: syncNovelChapters
      tags:
        - 论坛业务
      summary: 对比章节内容哈希
      description: |-
        客户端提交本地章节清单（含 SHA-256 哈希），服务端对比已存哈希，返回需要上传的章节与已存在（无需上传）的章节 ID。

        权限与失败状态均列于 responses；请求示例可使用 x-user-id: reader。
      parameters:
        - name: novelId
          in: path
          required: true
          description: 章节所属的文档/小说 ID
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
            description: 章节所属的文档/小说 ID
        - name: x-user-id
          in: header
          required: false
          description: 论坛身份 ID：author、reader 或 moderator；省略时默认 reader。生产接入时替换 AuthProvider。
          schema:
            type: string
            enum:
              - author
              - reader
              - moderator
            default: reader
          example: reader
      requestBody:
        required: true
        description: 请求字段由共享 Zod 契约校验。
        content:
          application/json:
            schema:
              type: object
              properties:
                chapters:
                  default: []
                  maxItems: 10000
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 128
                        pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                      title:
                        type: string
                        minLength: 1
                        maxLength: 500
                      order:
                        type: integer
                        minimum: 0
                        maximum: 9007199254740991
                      hash:
                        type: string
                        minLength: 1
                        maxLength: 128
                    required:
                      - id
                      - title
                      - order
                      - hash
                    additionalProperties: false
              required:
                - chapters
              additionalProperties: false
      responses:
        "200":
          description: 需要更新与已存在的章节 ID。
          content:
            application/json:
              schema:
                type: object
                properties:
                  toUpdate:
                    type: array
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                  existing:
                    type: array
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                required:
                  - toUpdate
                  - existing
                additionalProperties: false
      x-implementation-status: implemented
